<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Nisa Istifarra - Minggu 2</title>

    <!-- Library A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Library AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <!-- Scene utama AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Bagian pencahayaan -->
      <a-light
        id="cahaya-ambient"
        type="ambient"
        color="#ffffff"
        intensity="0.6"
      >
      </a-light>

      <a-light
        id="cahaya-directional"
        type="directional"
        color="#ffffff"
        intensity="0.8"
        position="1 3 2"
      >
      </a-light>

      <!-- Marker Hiro -->
      <a-marker id="marker-hiro" preset="hiro">
        <!-- Alas atau bidang datar -->
        <a-plane
          id="alas"
          position="0 0 0"
          rotation="-90 0 0"
          width="2"
          height="2"
          color="#e9e5fa"
          opacity="0.7"
          transparent="true"
        >
        </a-plane>

        <!-- Mengelompokkan semua objek dalam satu entity induk -->
        <a-entity id="kelompok-objek" position="0 0 0" scale="1 1 1">
          <!-- Objek 1: Kubus biru -->
          <a-box
            id="kubus-biru"
            position="-0.6 0.25 0"
            width="0.5"
            height="0.5"
            depth="0.5"
            color="#4C6EF5"
          >
          </a-box>

          <!-- Objek 2: Bola oranye -->
          <a-sphere
            id="bola-oranye"
            position="0 0.3 0"
            radius="0.3"
            color="#D9531E"
            metalness="0.1"
            roughness="0.4"
          >
          </a-sphere>

          <!-- Objek 3: Silinder hijau kebiruan dengan animasi rotasi -->
          <a-cylinder
            id="silinder-hijau"
            position="0.6 0.3 0"
            radius="0.2"
            height="0.6"
            color="#0B7F73"
            animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear"
          >
          </a-cylinder>

          <!-- Objek 4: Kubus dengan tekstur kayu -->
          <a-box
            id="kubus-tekstur"
            position="0 0.15 0.7"
            width="0.5"
            height="0.3"
            depth="0.5"
            src="assets/img/tekstur.jpg"
          >
          </a-box>
        </a-entity>
        <!-- Akhir kelompok objek -->
      </a-marker>

      <!-- Kamera AR -->
      <a-entity id="kamera-ar" camera></a-entity>
    </a-scene>
  </body>
</html>
